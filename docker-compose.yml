services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env          # NEBIUS_API_KEY, NEBIUS_BASE_URL, model slugs, NEBIUS_ONLY
    expose:
      - "8000"
    restart: unless-stopped
    # No GPU needed — LLM inference runs on Nebius Token Factory
    # healthcheck lets the web service wait until the backend is ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
